# Pipeline sem nenhuma verificação de segurança: apenas build e publicação.
# Os branches seguintes (scans, fix/*) adicionam as verificações aos poucos.
stages:
  - build
  - publish

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

build-images:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  script:
    - mkdir -p images
    - docker build -t shoes-backend:$CI_COMMIT_SHORT_SHA backend
    - docker build -t shoes-frontend:$CI_COMMIT_SHORT_SHA frontend
    - docker save -o images/backend.tar shoes-backend:$CI_COMMIT_SHORT_SHA
    - docker save -o images/frontend.tar shoes-frontend:$CI_COMMIT_SHORT_SHA
  artifacts:
    expire_in: 1 hour
    paths:
      - images/

# --------------------------------------------------------------- PUBLISH
# Publica as imagens no Container Registry do GitLab. Fica no último estágio:
# só executa se todos os jobs bloqueantes anteriores passaram.
publish-images:
  stage: publish
  image: docker:27
  services:
    - name: docker:27-dind
      command: ["--insecure-registry=gitlab:5050"]
  dependencies: [build-images]
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker load -i images/backend.tar
    - docker load -i images/frontend.tar
    - |
      for svc in backend frontend; do
        docker tag shoes-$svc:$CI_COMMIT_SHORT_SHA $CI_REGISTRY_IMAGE/$svc:$CI_COMMIT_SHORT_SHA
        docker push $CI_REGISTRY_IMAGE/$svc:$CI_COMMIT_SHORT_SHA
      done
